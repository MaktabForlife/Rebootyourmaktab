<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Academy Library</title>
  <link rel="stylesheet" href="/css/m4l-academy-library.css?v=105.4.3.13">
  <link rel="stylesheet" href="/css/m4l-academy-navigation.css?v=105.4.3.13">
</head>
<body>
  <header class="al-header"><a href="/academy/#overview">← My Academy</a><strong>Academy Library</strong><a id="al-manage-books" href="/academy/library/manage/" hidden>Manage Library</a></header>
  <main class="al-main">
    <div class="al-intro"><p class="al-eyebrow">﷽ &nbsp; One place to learn</p><h1>Library</h1><p>Books, printables, audio, video and more from across the Academy.</p></div>
    <p class="al-eyebrow">Module subscriptions and permanent access · Coming soon</p>
    <nav class="al-tabs" aria-label="Library view"><a href="/academy/library/" aria-current="page">For You</a><a href="/academy/open-library/">Explore</a></nav>
    <p id="al-status" role="status" aria-live="polite">Checking your Library access…</p>
    <div id="al-content" hidden>
      <div class="al-filters"><label>Search<input id="al-search" type="search" placeholder="Title, subject or source"></label><label>Source<select id="al-source"><option value="ALL">All sources</option></select></label></div>
      <div id="al-categories" class="library-category-pills" role="group" aria-label="Filter by category"><button type="button" data-category="ALL" aria-pressed="true">All</button><button type="button" data-category="PDF" aria-pressed="false">PDF</button><button type="button" data-category="AUDIOVISUAL" aria-pressed="false">AudioVisual</button><button type="button" data-category="OTHER" aria-pressed="false">Other</button></div>
      <div id="al-results" aria-live="polite"></div>
    </div>
  </main>
  <dialog id="al-preview" aria-labelledby="al-preview-title"><div class="al-preview-head"><div><small id="al-preview-source"></small><h2 id="al-preview-title"></h2></div><button id="al-close" type="button" aria-label="Close resource">✕</button></div><p id="al-preview-details"></p><div id="al-volume-wrap" class="al-volume" hidden><label id="al-volume-label" for="al-volume">Volume</label><select id="al-volume"></select></div><p id="al-preview-status" role="status" aria-live="polite"></p><div id="al-media"></div><a id="al-open" target="_blank" rel="noopener noreferrer" hidden>Open file in new tab ↗</a></dialog>
  <script src="/js/m4l-config.js?v=102.4"></script>
  <script src="/js/m4l-academy-library.js?v=105.4.3.13"></script>
  <script src="/js/m4l-academy-navigation.js?v=105.4.3.13"></script>
</body>
</html>
