<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Open Library · Umm Abbad Academy</title>
  <link rel="stylesheet" href="/css/m4l-academy-library.css?v=105.4.2.25">
  <link rel="stylesheet" href="/css/m4l-open-library.css?v=105.4.2.25">
</head>
<body>
  <header class="al-header"><a href="/academy/#overview">← Academy</a><strong>Open Library</strong><a href="/academy/library/">My Library</a></header>
  <main class="al-main">
    <div class="al-intro">
      <p class="al-eyebrow">﷽ &nbsp; Read and discover</p>
      <h1>Open Library</h1>
    </div>
    <div class="ol-search"><label for="ol-search">Search resources</label><input id="ol-search" type="search" placeholder="Title, subject or source"></div>
    <div id="ol-categories" class="library-category-pills" role="group" aria-label="Filter by category"><button type="button" data-category="ALL" aria-pressed="true">All</button><button type="button" data-category="EBOOK" aria-pressed="false">eBooks</button><button type="button" data-category="PRINTABLE" aria-pressed="false">Printables</button><button type="button" data-category="AUDIO" aria-pressed="false">Audio</button><button type="button" data-category="VIDEO" aria-pressed="false">Video</button><button type="button" data-category="OTHER" aria-pressed="false">Other</button></div>
    <p id="ol-status" class="ol-status" role="status" aria-live="polite"></p>
    <div id="ol-results"></div>
    <p id="ol-empty" class="al-empty" hidden>No resources match your search.</p>
  </main>
  <dialog id="ol-preview" aria-labelledby="ol-title">
    <div class="al-preview-head"><div><small id="ol-source"></small><h2 id="ol-title"></h2></div><button id="ol-close" type="button" aria-label="Close resource">✕</button></div>
    <p id="ol-details"></p>
    <div id="ol-volume-wrap" class="ol-volume" hidden><label id="ol-volume-label" for="ol-volume">Volume</label><select id="ol-volume"></select></div>
    <a id="ol-original" target="_blank" rel="noopener noreferrer">Open original PDF at source ↗</a>
    <iframe id="ol-viewer" title="Book preview"></iframe>
    <div id="ol-media"></div>
    <p class="ol-viewer-note">If the preview is unavailable, use the source link above.</p>
  </dialog>
  <script src="/js/m4l-config.js?v=102.4"></script>
  <script src="/js/m4l-open-library.js?v=105.4.3.8" defer></script>
</body>
</html>
