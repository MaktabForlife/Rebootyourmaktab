<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Courses · Umm Abbad Academy</title>
  <link rel="icon" href="/admin-favicon-32x32.png">
  <link rel="stylesheet" href="/css/m4l-program-builder.css?v=106.1">
  <link rel="stylesheet" href="/css/m4l-academy-navigation.css?v=106.1">
  <link rel="stylesheet" href="/css/m4l-academy-course-management.css?v=106.8">
</head>
<body>
  <header class="pb-header"><a class="pb-brand" href="/academy/#overview"><img src="/ummabbadacademy.png" alt="">Umm Abbad Academy</a><span id="course-account-name"></span><span class="pb-version">V106.8</span></header>
  <main class="cm-main">
    <div class="cm-page-heading"><a id="course-management-back" href="/academy/#administration">← Academy administration</a><h1>Courses</h1><span>Short courses, workshops &amp; bootcamps</span></div>
    <p id="course-access-message" class="pb-message" role="status" aria-live="polite">Checking your Academy account…</p>
    <button id="course-access-retry" class="pb-secondary" type="button" hidden>Try again</button>
    <section id="course-workspace" class="cm-workspace" aria-label="Course management" hidden>
      <aside class="cm-sidebar" aria-label="Find a Course">
        <div class="cm-list-toolbar"><strong id="course-count">Courses</strong><button id="course-new" type="button">+ New Course</button></div>
        <label class="cm-search">Find a Course<input id="course-search" type="search" placeholder="Search by name…" autocomplete="off"></label>
        <label class="cm-status-filter">Status<select id="course-status-filter"><option value="">All statuses</option><option>DRAFT</option><option>PUBLISHED</option><option>ACTIVE</option><option>COMPLETE</option><option>CANCELLED</option><option>ARCHIVED</option></select></label>
        <div id="course-list" class="cm-list"></div>
        <button id="course-refresh" type="button" class="pb-secondary cm-refresh">↻ Refresh Courses</button>
      </aside>
      <div id="course-editor" class="cm-editor"><div class="cm-empty"><h2>Your Course workspace</h2><p>Select a Course to manage its schedule and participants, or create a new draft.</p></div></div>
    </section>
    <p id="course-message" class="cm-message" role="status" aria-live="polite"></p>
    <dialog id="course-dialog" class="cm-dialog" aria-labelledby="course-dialog-title"></dialog>
  </main>
  <script src="/js/m4l-config.js?v=102.4"></script>
  <script src="/js/m4l-academy-course-management.js?v=106.8"></script>
  <script src="/js/m4l-academy-navigation.js?v=106.6"></script>
</body>
</html>
